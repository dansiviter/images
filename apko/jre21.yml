contents:
  repositories:
  - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
  - https://dl-cdn.alpinelinux.org/alpine/v3.22/community
  packages:
  - openjdk21-jre-headless

accounts:
  groups:
  - groupname: nonroot
    gid: 10000
  users:
  - username: nonroot
    uid: 10000
  run-as: nonroot

environment:
  PATH: /usr/lib/jvm/java-21-openjdk/bin/

archs:
 - x86_64
